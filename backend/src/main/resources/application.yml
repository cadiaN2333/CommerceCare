server:
  port: 8081

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: commercecare
  datasource:
    url: jdbc:postgresql://localhost:${COMMERCECARE_DB_PORT:5433}/${COMMERCECARE_DB_NAME:commercecare}
    username: ${COMMERCECARE_DB_USER:commercecare}
    password: ${COMMERCECARE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: deepseek
      embedding: dashscope
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-flash
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
management:
  endpoints:
    web:
      exposure:
        include: health
commercecare:
  search:
    lucene-path: ./data/lucene